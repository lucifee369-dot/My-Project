<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Program</title>
    <link rel="stylesheet" href="program.css">
</head>
<body>

    <div id="todoApp">

        <h1 id="myH1">My To-Do List</h1>

        <div id="inputArea">
            <input type="text" id="myInput">
            <button id="addBtn">ADD</button> 
        </div>

        <label id="myLabel"></label>

        <div id="taskStats">
            <p id="totalTask">Total Task: 0</p>
            <p id="completedTask">Completed Task: 0</p>
        </div>

        <div id="taskFilters">
            <button id="allBtn">All</button>
            <button id="activeBtn">Active</button>
            <button id="completedBtn">Completed</button>    
        </div>

        <div id="taskContainer">
            <!--tasks-->
        </div>

    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script type="module" src="program.js"></script>
</body>
</html>
